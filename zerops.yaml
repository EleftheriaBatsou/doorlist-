zerops:
  # appdev — mutable workspace. Code arrives via SSHFS; the dev server (Fastify + Vite
  # middleware, live reload) is started with zerops_dev_server, not run.start.
  - setup: dev
    build:
      base: alpine/nodejs@24
      buildCommands:
        - npm install
      deployFiles: [.]
      cache: [node_modules]
    run:
      base: alpine/nodejs@24
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NODE_ENV: development
        PORT: "3000"
        HMR_CLIENT_PORT: "443"
        DATABASE_URL: postgresql://${db_user}:${db_password}@db:${db_port}/${db_dbName}
        REDIS_URL: ${cache_connectionString}
        NATS_HOST: ${queue_hostname}
        NATS_PORT: ${queue_port}
        NATS_USER: ${queue_user}
        NATS_PASS: ${queue_password}
        S3_ENDPOINT: ${storage_apiUrl}
        S3_BUCKET: ${storage_bucketName}
        S3_ACCESS_KEY_ID: ${storage_accessKeyId}
        S3_SECRET_ACCESS_KEY: ${storage_secretAccessKey}
        S3_REGION: us-east-1
      start: zsc noop --silent

  # appstage — production build: compiled server + static SPA bundle served by Fastify.
  - setup: prod
    build:
      base: alpine/nodejs@24
      buildCommands:
        - npm ci
        - npm run build
        - npm prune --omit=dev
      deployFiles:
        - dist
        - node_modules
        - package.json
      cache: [node_modules]
    run:
      base: alpine/nodejs@24
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NODE_ENV: production
        PORT: "3000"
        DATABASE_URL: postgresql://${db_user}:${db_password}@db:${db_port}/${db_dbName}
        REDIS_URL: ${cache_connectionString}
        NATS_HOST: ${queue_hostname}
        NATS_PORT: ${queue_port}
        NATS_USER: ${queue_user}
        NATS_PASS: ${queue_password}
        S3_ENDPOINT: ${storage_apiUrl}
        S3_BUCKET: ${storage_bucketName}
        S3_ACCESS_KEY_ID: ${storage_accessKeyId}
        S3_SECRET_ACCESS_KEY: ${storage_secretAccessKey}
        S3_REGION: us-east-1
      start: npm start
      healthCheck:
        httpGet:
          port: 3000
          path: /api/health
      readinessCheck:
        httpGet:
          port: 3000
          path: /api/health
